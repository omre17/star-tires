<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}צמיגי הכוכב{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa; /* אפור בהיר ונעים */
      font-family: Arial, sans-serif;
    }

    .content-wrapper {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
