{% extends "base.html" %}

{% block title %}התחברות{% endblock %}

{% block content %}
<div class="container mt-5" dir="rtl">
  <h2 class="mb-4 text-center">התחברות</h2>
  <form method="POST" class="border p-4 rounded shadow-sm bg-light">
    <div class="mb-3">
      <label class="form-label">שם משתמש</label>
      <input name="username" placeholder="שם משתמש" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">סיסמה</label>
      <input name="password" type="password" placeholder="סיסמה" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary w-100">כניסה</button>
    
    {% if error %}
      <div class="alert alert-danger mt-3" role="alert">
        {{ error }}
      </div>
    {% endif %}
  </form>
</div>
{% endblock %}
